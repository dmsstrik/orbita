[project]
name = "orbita-social-graphs"
version = "1.3.1"
description = "Локальная лаборатория симметрий социальных графов"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "networkx>=3.4,<4",
    "pynauty>=2.8.8,<3",
    "numpy>=2,<3",
    "httpx>=0.27,<1",
    "scipy>=1.14,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
